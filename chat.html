<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRVT_CHAT // Secure Communication Protocol</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --panel-bg: #161820;
            --accent-color: #00ffa3;
            --accent-dim: #00b372;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border-color: #232735;
            --system-red: #ff4a5a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
        }

        /* --- 認証（パスワード）画面 --- */
        #auth-screen {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1d29 0%, #0d0e12 100%);
            z-index: 100;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        .auth-container {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .auth-logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .auth-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .password-input {
            width: 100%;
            background: #0d0e12;
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            border-radius: 8px;
            color: white;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 6px;
            transition: all 0.3s;
        }

        .password-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(0, 255, 163, 0.25);
        }

        .btn-submit {
            width: 100%;
            background: var(--accent-color);
            color: #0d0e12;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .btn-submit:hover {
            background: #26ffb5;
            box-shadow: 0 0 15px rgba(0, 255, 163, 0.4);
        }

        .error-msg {
            color: var(--system-red);
            font-size: 0.8rem;
            margin-top: 0.6rem;
            height: 18px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* --- メインチャット画面 --- */
        #app-screen {
            display: grid;
            grid-template-columns: 280px 1fr;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease;
        }

        /* サイドバー */
        .sidebar {
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--accent-color);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
        }

        .chat-item {
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-item:hover, .chat-item.active {
            background: rgba(255, 255, 255, 0.03);
        }

        .chat-item.active {
            border-left: 3px solid var(--accent-color);
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #1f2330;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--accent-color);
            border: 1px solid var(--border-color);
        }

        .chat-info {
            flex: 1;
            overflow: hidden;
        }

        .chat-name {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .chat-preview {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* チャットエリア */
        .main-chat {
            display: flex;
            flex-direction: column;
            background: #0d0e12;
        }

        .chat-header {
            height: 70px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
        }

        .encryption-badge {
            font-size: 0.7rem;
            background: rgba(0, 255, 163, 0.06);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 163, 0.2);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .message-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .message {
            max-width: 65%;
            display: flex;
            flex-direction: column;
        }

        .message.sent {
            align-self: flex-end;
        }

        .message.received {
            align-self: flex-start;
        }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-all;
        }

        .sent .msg-bubble {
            background: var(--accent-color);
            color: #0d0e12;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .received .msg-bubble {
            background: var(--panel-bg);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .msg-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 5px;
            align-self: flex-end;
        }
        
        .received .msg-time {
            align-self: flex-start;
        }

        /* メッセージ入力欄 */
        .input-area {
            padding: 1.5rem 2rem;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            background: #0d0e12;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 6px 6px 6px 18px;
            align-items: center;
            transition: border-color 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-color);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 0.95rem;
            padding: 8px 0;
        }

        .chat-input:focus {
            outline: none;
        }

        .btn-send {
            background: var(--accent-color);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: #0d0e12;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-send:hover {
            transform: scale(1.05);
            background: #26ffb5;
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-container">
            <div class="auth-logo">◆ NODE_SECURE</div>
            <div class="auth-subtitle">ENTER PASSKEY TO DECRYPT</div>
            <div class="input-group">
                <input type="password" id="passkey" class="password-input" placeholder="••••" autocomplete="off">
                <div id="error-text" class="error-msg">認証キーが一致しません</div>
            </div>
            <button class="btn-submit" onclick="verifyAccess()">ACCESS PORTAL</button>
        </div>
    </div>

    <div id="app-screen">
        <div class="sidebar">
            <div class="sidebar-header">
                <span style="font-weight: 700; letter-spacing: 1.5px; font-size: 0.85rem; color: var(--text-muted);">CHANNELS</span>
                <span class="status-dot"></span>
            </div>
            <div class="chat-list">
                <div class="chat-item active">
                    <div class="avatar">G</div>
                    <div class="chat-info">
                        <div class="chat-name">Ghost_Node</div>
                        <div class="chat-preview">セッションの初期化が完了しました。</div>
                    </div>
                </div>
                <div class="chat-item">
                    <div class="avatar">A</div>
                    <div class="chat-info">
                        <div class="chat-name">Alpha_Core</div>
                        <div class="chat-preview">[データストリームは保護されています]</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <div>
                    <div style="font-weight: 600; font-size: 1.05rem; letter-spacing: 0.5px;">Ghost_Node</div>
                    <div style="font-size: 0.75rem; color: var(--accent-color); font-weight: 600; margin-top: 2px;">● ONLINE</div>
                </div>
                <div class="encryption-badge">
                    🔒 P2P ENCRYPTED
                </div>
            </div>

            <div class="message-container" id="msg-container">
                <div class="message received">
                    <div class="msg-bubble">エンドツーエンドで保護されたローカル環境です。入力されたデータは外部サーバーに送信されません。</div>
                    <div class="msg-time">System</div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="user-input" class="chat-input" placeholder="セキュアメッセージを入力..." onkeypress="handleKeyPress(event)">
                    <button class="btn-send" onclick="sendMessage()">➔</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // デフォルトのパスワード（自由に変更してください）
        const SECRET_KEY = "1234";

        // パスワード認証処理
        function verifyAccess() {
            const input = document.getElementById('passkey').value;
            const errorText = document.getElementById('error-text');
            const authScreen = document.getElementById('auth-screen');
            const appScreen = document.getElementById('app-screen');

            if (input === SECRET_KEY) {
                // 認証成功時、滑らかに画面を切り替える
                authScreen.style.opacity = '0';
                authScreen.style.visibility = 'hidden';
                
                appScreen.style.display = 'grid';
                setTimeout(() => {
                    appScreen.style.opacity = '1';
                    appScreen.style.visibility = 'visible';
                }, 50);
            } else {
                // 認証失敗時
                errorText.style.opacity = '1';
                document.getElementById('passkey').value = '';
                setTimeout(() => {
                    errorText.style.opacity = '0';
                }, 2500);
            }
        }

        // メッセージ送信処理
        function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('msg-container');
            const text = input.value.trim();

            if (text === '') return;

            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            // 送信メッセージの生成
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message sent';
            msgDiv.innerHTML = `
                <div class="msg-bubble">${escapeHTML(text)}</div>
                <div class="msg-time">${timeStr}</div>
            `;

            container.appendChild(msgDiv);
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // 擬似自動返信（フロントエンドのモック動作用）
            setTimeout(() => {
                const replyDiv = document.createElement('div');
                replyDiv.className = 'message received';
                replyDiv.innerHTML = `
                    <div class="msg-bubble">ローカルでメッセージオブジェクトを受信。正常にダミー処理されました。</div>
                    <div class="msg-time">${timeStr}</div>
                `;
                container.appendChild(replyDiv);
                container.scrollTop = container.scrollHeight;
            }, 1000);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 安全対策（エスケープ処理）
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
