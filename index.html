<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRVT_CHAT // Mobile Protocol</title>
    <style>
        :root {
            --bg-black: #05070b;
            --panel-dark: #10121a;
            --panel-lighter: #171a25;
            --accent-green: #00ff9d;
            --accent-dim: #00a868;
            --text-primary: #ffffff;
            --text-secondary: #8f9cae;
            --border-color: #1e2230;
            --danger: #ff3b30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; /* タップ時の青い影を消す */
        }

        body, html {
            width: 100%;
            height: 100dvh; /* スマホのキーボード・ツールバー対策 */
            background-color: var(--bg-black);
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
        }

        /* --- 1. 認証画面 --- */
        #auth-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #111420 0%, #05070b 100%);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        .auth-card {
            background: var(--panel-dark);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        .auth-title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--accent-green);
            margin-bottom: 0.5rem;
        }

        .auth-desc {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .pin-input {
            width: 100%;
            background: var(--bg-black);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            color: white;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 8px;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .pin-input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.15);
        }

        .btn-auth {
            width: 100%;
            background: var(--accent-green);
            color: var(--bg-black);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .error-hint {
            color: var(--danger);
            font-size: 0.75rem;
            margin-top: 0.8rem;
            height: 16px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        /* --- 2. メインアプリケーション構造 --- */
        #app-screen {
            display: flex;
            width: 200%; /* 2画面分（一覧とトーク）を横に並べる */
            height: 100%;
            transition: transform 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.94);
            /* デフォルトは一覧表示 */
            transform: translateX(0); 
        }

        /* 状態管理用のクラス（JSで切り替え） */
        #app-screen.show-chat {
            transform: translateX(-50%); /* トーク画面へスライド */
        }

        .view-panel {
            width: 50%; /* 1画面の幅は100% */
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-black);
        }

        /* --- 3. 共通ヘッダーコンポーネント --- */
        .app-header {
            height: 64px;
            background: var(--panel-dark);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            position: relative;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            flex: 1;
            text-align: center;
        }

        /* 導線用の戻るボタン */
        .btn-back {
            background: transparent;
            border: none;
            color: var(--accent-green);
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            position: absolute;
            left: 16px;
            height: 100%;
            padding-right: 16px;
        }

        /* --- 4. チャット一覧画面（List View） --- */
        .search-bar {
            padding: 12px 16px;
            background: var(--bg-black);
        }

        .search-input {
            width: 100%;
            background: var(--panel-dark);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 10px;
            color: white;
            font-size: 0.85rem;
            outline: none;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-row {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid rgba(30, 34, 48, 0.5);
            cursor: pointer;
        }

        .chat-row:active {
            background: var(--panel-dark); /* タップした瞬間のフィードバック */
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 14px; /* 少し角丸の四角でモダンに */
            background: var(--panel-lighter);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--accent-green);
            margin-right: 14px;
        }

        .row-body {
            flex: 1;
            overflow: hidden;
        }

        .row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .node-name {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .node-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .node-preview {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- 5. トーク画面（Chat View） --- */
        .secure-badge {
            font-size: 0.65rem;
            background: rgba(0, 255, 157, 0.06);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 157, 0.2);
            position: absolute;
            right: 16px;
        }

        .timeline {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .bubble-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }

        .bubble-wrapper.me {
            align-self: flex-end;
        }

        .bubble-wrapper.other {
            align-self: flex-start;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-all;
        }

        .me .bubble {
            background: var(--accent-green);
            color: var(--bg-black);
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .other .bubble {
            background: var(--panel-dark);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .stamp {
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-top: 4px;
            padding: 0 4px;
        }
        .me .stamp { align-self: flex-end; }
        .other .stamp { align-self: flex-start; }

        /* スマホ用ボトム入力エリア */
        .bottom-input-zone {
            padding: 12px 16px;
            background: var(--panel-dark);
            border-top: 1px solid var(--border-color);
        }

        .input-box-wrapper {
            display: flex;
            align-items: center;
            background: var(--bg-black);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 4px 4px 4px 14px;
        }

        .input-box-wrapper:focus-within {
            border-color: var(--accent-green);
        }

        .mobile-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 0.95rem;
            padding: 8px 0;
            outline: none;
        }

        .btn-action-send {
            width: 36px;
            height: 36px;
            background: var(--accent-green);
            border: none;
            border-radius: 50%;
            color: var(--bg-black);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <div class="auth-title">CORE_LOCK</div>
            <div class="auth-desc">PASSKEY REQUIRED</div>
            <input type="password" id="pin-code" class="pin-input" placeholder="••••" inputmode="numeric" pattern="[0-3]*" autocomplete="off">
            <button class="btn-auth" onclick="unlockApp()">UNLOCK</button>
            <div id="error-hint" class="error-hint">INVALID KEY</div>
        </div>
    </div>

    <div id="app-screen">
        
        <div class="view-panel" id="list-view">
            <div class="app-header">
                <div class="header-title" style="text-align: left; padding-left: 8px; color: var(--accent-green);">NODES</div>
            </div>
            <div class="search-bar">
                <input type="text" class="search-input" placeholder="検索..." disabled>
            </div>
            <div class="chat-list">
                <div class="chat-row" onclick="openChat('Ghost_Node')">
                    <div class="avatar">GN</div>
                    <div class="row-body">
                        <div class="row-header">
                            <span class="node-name">Ghost_Node</span>
                            <span class="node-time">現在</span>
                        </div>
                        <div class="node-preview" id="last-msg-preview">セッションの初期化が完了しました。</div>
                    </div>
                </div>
                <div class="chat-row" onclick="openChat('Alpha_Core')">
                    <div class="avatar">AC</div>
                    <div class="row-body">
                        <div class="row-header">
                            <span class="node-name">Alpha_Core</span>
                            <span class="node-time">1日前</span>
                        </div>
                        <div class="node-preview">[データストリーム保護済]</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="view-panel" id="chat-view">
            <div class="app-header">
                <button class="btn-back" onclick="closeChat()">‹ BACK</button>
                <div class="header-title" id="chat-target-name">Ghost_Node</div>
                <div class="secure-badge">E2EE</div>
            </div>
            
            <div class="timeline" id="timeline-container">
                <div class="bubble-wrapper other">
                    <div class="bubble">エンドツーエンドで保護されたローカル環境です。入力されたデータは外部サーバーに送信されません。</div>
                    <div class="stamp">System</div>
                </div>
            </div>

            <div class="bottom-input-zone">
                <div class="input-box-wrapper">
                    <input type="text" id="msg-input" class="mobile-input" placeholder="暗号化メッセージ..." onkeypress="checkEnter(event)">
                    <button class="btn-action-send" onclick="sendMobileMessage()">➔</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const KEY = "1234"; // パスワード変更はここ
        let currentTarget = "Ghost_Node";

        // パスワード認証
        function unlockApp() {
            const pin = document.getElementById('pin-code').value;
            const error = document.getElementById('error-hint');
            
            if (pin === KEY) {
                const auth = document.getElementById('auth-screen');
                auth.style.opacity = '0';
                auth.style.visibility = 'hidden';
            } else {
                error.style.opacity = '1';
                document.getElementById('pin-code').value = '';
                setTimeout(() => error.style.opacity = '0', 2000);
            }
        }

        // 導線：チャットを開く（右へスライド）
        function openChat(nodeName) {
            currentTarget = nodeName;
            document.getElementById('chat-target-name').innerText = nodeName;
            document.getElementById('app-screen').classList.add('show-chat');
        }

        // 導線：チャットを閉じて一覧に戻る（左へスライド）
        function closeChat() {
            document.getElementById('app-screen').classList.remove('show-chat');
        }

        // メッセージ送信
        function sendMobileMessage() {
            const input = document.getElementById('msg-input');
            const container = document.getElementById('timeline-container');
            const preview = document.getElementById('last-msg-preview');
            const text = input.value.trim();

            if (text === '') return;

            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            // 自分のメッセージ追加
            const wrapper = document.createElement('div');
            wrapper.className = 'bubble-wrapper me';
            wrapper.innerHTML = `
                <div class="bubble">${escapeSafe(text)}</div>
                <div class="stamp">${timeStr}</div>
            `;
            container.appendChild(wrapper);
            
            // 一覧側のプレビュー文章も更新（導線のリアリティ向上）
            if(currentTarget === "Ghost_Node") {
                preview.innerText = text;
            }

            input.value = '';
            container.scrollTop = container.scrollHeight;

            // 擬似自動返信
            setTimeout(() => {
                const replyWrapper = document.createElement('div');
                replyWrapper.className = 'bubble-wrapper other';
                replyWrapper.innerHTML = `
                    <div class="bubble">パケット受信。シグナルは正常に処理されました。</div>
                    <div class="stamp">${timeStr}</div>
                `;
                container.appendChild(replyWrapper);
                container.scrollTop = container.scrollHeight;
                
                if(currentTarget === "Ghost_Node") {
                    preview.innerText = "パケット受信。シグナルは正常に処理されました。";
                }
            }, 1000);
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendMobileMessage();
        }

        function escapeSafe(str) {
            return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
        }
    </script>
</body>
</html>
